location /api/ {
    proxy_pass http://wiki_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
}
# Only image formats accepted by the API are public. Manifests and Markdown stay private.
location ~* "^/objects/(articles/[0-9a-f-]{36}/(?:[^/.][^/]*/)*[^/.][^/]*\.(?:png|jpe?g|gif|webp|avif))$" {
    alias /data/objects/$1;
    disable_symlinks on from=/data/objects;
    etag off;
    if_modified_since off;
}
location /objects/ { return 404; }
location = /admin { return 301 /admin/; }
location /admin/ { proxy_pass http://wiki_admin/; proxy_cache off; }
location = /client { return 301 /client/; }
location /client/ { proxy_pass http://wiki_client/; proxy_cache off; }
location / { proxy_pass http://wiki_public; proxy_cache off; }
