events { worker_connections 1024; }
http {
    # Docker can assign new container IPs when an application is rebuilt.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    upstream wiki_api { zone wiki_api 64k; server api:3000 resolve; }
    upstream wiki_public { zone wiki_public 64k; server public-web:80 resolve; }
    upstream wiki_admin { zone wiki_admin 64k; server admin-web:80 resolve; }
    upstream wiki_client { zone wiki_client 64k; server client-web:80 resolve; }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method","uri":"$uri","duration":$request_time}';
    access_log /var/log/nginx/access.log json;
    server { listen 80; server_name _; return 301 https://$host$request_uri; }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 21m;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        include /etc/nginx/wiki-locations.conf;
    }
}
